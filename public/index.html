<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peakx SD</title>
<link rel="icon" href="favicon.png">
<style>
:root{--white:#fff;--ice:#eef5ff;--sky:#9cc6ff;--blue:#1f6bff;--deep:#0b2a6b;--line:#d5e3fb;--mute:#6b84b3;
  --font:"Segoe UI Variable Display","Segoe UI","SF Pro Display",system-ui,-apple-system,sans-serif}
:root{--surf:#fff;--sub:#46659f;--bar:rgba(238,245,255,.78);--tab:rgba(255,255,255,.45);--tabh:rgba(255,255,255,.8);--bgimg:linear-gradient(160deg,#fff 0%,#eef5ff 55%,#dbe9ff 100%);--bl1:#9cc6ff;--bl2:#5b9bff;--bl3:#cfe2ff;--wavec:#9cc6ff}
html[data-theme=dark]{--surf:#111a2f;--ice:#19243f;--line:#28365f;--deep:#e8eeff;--mute:#8fa2d4;--sub:#9fb2e3;--blue:#4d8dff;--bar:rgba(11,17,33,.85);--tab:rgba(255,255,255,.06);--tabh:rgba(255,255,255,.13);--bgimg:linear-gradient(160deg,#070b16 0%,#0c1427 55%,#101c3a 100%);--bl1:#1b3a8a;--bl2:#3b2a8f;--bl3:#123060;--wavec:#1c3a82;color-scheme:dark}
html[data-theme=light]{--ice:#f3f5f9;--line:#e2e7f0;--deep:#1a2340;--mute:#7a869f;--sub:#5b6785;--bar:rgba(246,248,252,.85);--bgimg:linear-gradient(160deg,#fff 0%,#fbfcff 50%,#f4f7ff 100%);--bl1:#ffd9c7;--bl2:#d9f2e6;--bl3:#e3d9ff;--wavec:#e8ecff}
.wave path{fill:var(--wavec)}
.bubbles{display:none}
html[data-theme=light] .bubbles{display:block}
.bub{position:absolute;bottom:-90px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(150,185,255,.22));border:1px solid rgba(120,150,230,.22);animation:rise linear infinite}
@keyframes rise{to{transform:translate(var(--dx),-118vh)}}
#widgets{position:absolute;top:18px;right:22px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
#w-clock{font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1}
#w-date{font-size:14px;color:var(--sub)}
#sc{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:26px auto 0;max-width:640px}
.sc{position:relative;width:88px;padding:10px 4px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:background .15s}
.sc:hover{background:var(--tabh)}
.sc .ic{width:48px;height:48px;border-radius:14px;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center;font-size:26px;color:var(--blue)}
.sc .ic img{width:26px;height:26px;object-fit:contain}
.sc .nm{font-size:12px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .rm{position:absolute;top:2px;right:6px;display:none;font-style:normal;width:18px;height:18px;line-height:16px;border-radius:9px;background:var(--surf);border:1px solid var(--line);font-size:12px}
.sc:hover .rm{display:block}
.tab .mu{display:none;font-size:11px;font-weight:400}
.tab.muted .mu{display:inline}
.tab.pin{min-width:46px;max-width:46px;flex:none;padding:0 0 0 14px}
.tab.pin span,.tab.pin .x,.tab.pin .mu{display:none}
#sett .box{width:min(700px,94vw)}
#sett iframe{height:430px}
.addbox{padding:24px}
.addbox h3{margin-bottom:14px}
.addbox input{width:100%;height:44px;margin-bottom:10px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--ice);color:var(--deep);font:inherit}
.addbox input:focus{outline:none;border-color:var(--blue)}
.two{display:flex;gap:10px;margin-top:6px}
.two button{flex:1;height:44px;border-radius:12px;background:var(--ice);color:var(--blue);font-weight:600}
.two .pri{background:var(--blue);color:#fff}
#veil{position:fixed;inset:0;z-index:39;display:none}
#ctx{position:fixed;z-index:40;display:none;width:176px;height:176px;border:0;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.28)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--deep);background:var(--surf);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.bg{position:fixed;inset:0;z-index:0;background:var(--bgimg);overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.b1{width:46vmax;height:46vmax;background:var(--bl1);left:-12vmax;top:-14vmax;animation:d1 22s ease-in-out infinite alternate}
.b2{width:38vmax;height:38vmax;background:var(--bl2);right:-10vmax;top:10vh;opacity:.4;animation:d2 28s ease-in-out infinite alternate}
.b3{width:34vmax;height:34vmax;background:var(--bl3);left:25vw;bottom:-18vmax;animation:d3 25s ease-in-out infinite alternate}
.wave{position:absolute;left:0;bottom:0;width:200%;height:30vh;opacity:.5;animation:slide 18s linear infinite}
@keyframes d1{to{transform:translate(18vmax,12vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-16vmax,18vmax) scale(.9)}}
@keyframes d3{to{transform:translate(14vmax,-10vmax) scale(1.2)}}
@keyframes slide{to{transform:translateX(-50%)}}

.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
.brand{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3b82ff,#1f6bff);display:grid;place-items:center;flex:none}
.brand img{width:22px;height:22px}

#tabsbar{display:flex;align-items:flex-end;gap:6px;padding:8px 10px 0;background:var(--bar);backdrop-filter:blur(14px);min-height:46px}
#tabsbar .brand{margin-bottom:3px}
#tabs{display:flex;align-items:flex-end;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tab{display:flex;align-items:center;gap:8px;min-width:120px;max-width:210px;flex:1 1 180px;height:36px;padding:0 8px 0 12px;border-radius:12px 12px 0 0;background:var(--tab);font-size:13px;cursor:pointer;transition:background .15s}
.tab:hover{background:var(--tabh)}
.tab.on{background:var(--surf);box-shadow:0 -2px 0 var(--blue) inset;font-weight:600}
.tab img{width:16px;height:16px;border-radius:4px;flex:none;object-fit:contain}
.tab span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{width:20px;height:20px;border-radius:6px;line-height:20px;text-align:center;opacity:.6}
.tab .x:hover{background:var(--ice);opacity:1}
#newtab{width:32px;height:32px;margin-bottom:2px;border-radius:10px;font-size:20px;flex:none}
#newtab:hover{background:var(--tabh)}

#bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--surf);border-bottom:1px solid var(--line)}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;transition:background .15s}
.ib:hover{background:var(--ice)}
.ib svg{width:19px;height:19px;stroke:var(--deep);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.txt{width:auto;padding:0 12px;font-size:13px;font-weight:600;background:var(--ice);color:var(--blue)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
#url{flex:1;min-width:0;height:38px;padding:0 16px;border-radius:19px;border:1.5px solid var(--line);background:var(--ice);font:inherit;font-size:14px;color:var(--deep);transition:border-color .15s,background .15s}
#url:focus{outline:none;border-color:var(--blue);background:var(--surf)}
#pbtn{width:38px;height:38px;border-radius:50%;padding:2px;border:2px solid var(--line);flex:none}
#pbtn:hover{border-color:var(--blue)}
#pbtn img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}

#stage{position:absolute;left:0;right:0;bottom:0;top:var(--top,100px)}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
#stage iframe.on{display:block}
#home{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
#home .brand{width:92px;height:92px;border-radius:26px;margin:0 auto 22px;box-shadow:0 18px 50px rgba(31,107,255,.35)}
#home .brand img{width:60px;height:60px}
#home h1{font-size:clamp(48px,11vw,104px);font-weight:800;letter-spacing:-.045em;line-height:.95}
#home h1 i{font-style:normal;color:var(--blue)}
#home p{margin-top:16px;font-size:16px;color:var(--sub)}
#status{margin-top:22px;display:inline-block;max-width:560px;padding:8px 14px;border-radius:12px;font-size:13px;background:var(--surf);border:1px solid var(--line)}
#status.err{border-color:#f0b4b4;color:#9b1c1c;background:#fff5f5}
#status.ok{color:#14663a}

#hist{position:absolute;left:0;top:0;bottom:0;width:min(340px,86vw);background:var(--surf);border-right:1px solid var(--line);box-shadow:10px 0 40px rgba(11,42,107,.12);transform:translateX(-102%);transition:transform .25s ease;z-index:5;display:flex;flex-direction:column}
#hist.open{transform:none}
#hist header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:700;border-bottom:1px solid var(--line)}
#hist ul{list-style:none;padding:6px;overflow-y:auto;flex:1}
#hist li{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px}
#hist li:hover{background:var(--ice)}
#hist li img{width:16px;height:16px;flex:none}
#hist li div{min-width:0}
#hist li b,#hist li small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hist li small{color:var(--mute)}
#hist .empty{padding:18px;color:var(--mute);font-size:13px;cursor:default}
#clear{font-size:12px;color:var(--blue);font-weight:600}

#peek{position:fixed;z-index:20;width:260px;padding:12px;border-radius:14px;background:var(--surf);border:1px solid var(--line);box-shadow:0 14px 40px rgba(11,42,107,.18);pointer-events:none;opacity:0;transform:translateY(-4px);transition:opacity .12s,transform .12s}
#peek.show{opacity:1;transform:none}
#peek .t{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px}
#peek .t img{width:18px;height:18px;object-fit:contain}
#peek .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#peek small{display:block;margin-top:6px;color:var(--mute);font-size:12px;word-break:break-all}

.modal{position:fixed;inset:0;z-index:30;background:rgba(11,42,107,.35);backdrop-filter:blur(4px);display:none;place-items:center}
.modal.open{display:grid}
.box{width:min(420px,92vw);border-radius:22px;background:var(--surf);overflow:hidden;box-shadow:0 30px 80px rgba(11,42,107,.3);animation:pop .22s ease}
.box iframe{display:block;width:100%;height:360px;border:0}
.box>button{display:block;width:100%;padding:13px;font-weight:600;background:var(--ice);color:var(--blue)}
#cframe{height:300px!important}
#reg .box{padding:30px 26px;text-align:center}
#reg .brand{width:64px;height:64px;border-radius:18px;margin:0 auto 14px}
#reg .brand img{width:42px;height:42px}
#reg h2{font-size:24px;letter-spacing:-.03em}
#reg p{margin:8px 0 18px;color:var(--sub);font-size:14px}
#reg input{width:100%;height:46px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--ice);font:inherit;font-size:15px;color:var(--deep)}
#reg input:focus{outline:none;border-color:var(--blue);background:var(--surf)}
#reg #go{margin-top:12px;width:100%;height:46px;border-radius:14px;background:var(--blue);color:#fff;font-weight:600}
#reg small{display:block;min-height:18px;margin-top:10px;color:#9b1c1c;font-size:12px}
@keyframes pop{from{transform:scale(.94);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html.hasbg .bg{background:var(--ubg) center/cover no-repeat}
html.hasbg .blob,html.hasbg .wave,html.hasbg .bubbles{display:none}
html.hasbg .bg::after{content:"";position:absolute;inset:0;background:var(--surf);opacity:.28}
#rules{position:absolute;top:32px;right:250px;font-size:14px;color:var(--sub)}
#rules button{color:var(--blue);font-weight:600;text-decoration:underline;margin-left:4px}
@media(max-width:700px){#rules{right:auto;left:16px;top:22px}}
#w-mem{font-size:13px;color:var(--sub)}
#upd{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:25;display:none;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:14px;background:var(--surf);color:var(--deep);border:1px solid var(--blue);box-shadow:0 14px 40px rgba(31,107,255,.25);font-size:14px}
#upd button{padding:7px 14px;border-radius:10px;background:var(--blue);color:#fff;font-weight:600}
#rulesm iframe{height:340px}
</style>
</head>
<body>

  </div>
  <div id="stage">
    <div id="home"><div id="widgets"><b id="w-clock"></b><span id="w-date"></span><span id="w-mem"></span></div>
    <div id="rules"><span>Rules:</span><button id="rbtn">Open Rules</button></div><div>
      <div class="brand"><img src="logo.png" alt=""></div>
      <h1>Peakx <i>SD</i></h1>
      <p>Type a link or a search in the bar above.</p>
      <div id="sc"></div>

      <ul id="hlist"></ul>

  </div>
</div>

<div id="peek"><div class="t"><img alt=""><span></span></div><small></small></div>

<div class="modal" id="credits"><div class="box"><iframe title="Credits" id="cframe"></iframe><button id="cclose">Close</button></div></div>
<div class="modal" id="prof"><div class="box"><iframe title="Profile" id="pframe"></iframe><button id="pclose">Close</button></div></div>

  <div class="brand"><img src="logo.png" alt=""></div>

<div class="modal" id="sett"><div class="box"><iframe title="Settings" id="sframe"></iframe><button id="sclose">Close</button></div></div>
<div class="modal" id="addm"><div class="box addbox"><h3>Add site</h3><input id="sname" placeholder="Name" maxlength="24"><input id="surl" placeholder="Link, e.g. youtube.com" autocapitalize="off" spellcheck="false"><div class="two"><button id="scancel">Cancel</button><button id="sadd" class="pri">Add</button></div></div></div>

<script>

  function clearBg(){bgData="";try{localStorage.removeItem("peakx:bg")}catch(e){}applyBg()}
  applyBg();

  function apiBase(){var w=window.PEAKX_WISP;return w?w.replace(/^ws/,"http").replace(/\/wisp\/?$/,""):location.origin}
  function api(path,opt){return fetch(apiBase()+path,Object.assign({cache:"no-store"},opt||{})).then(function(r){return r.json()})}
  function newId(){var a=new Uint8Array(12);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(b){return("0"+b.toString(16)).slice(-2)}).join("")}
  function regRemote(){
    if(!profile)return;if(!profile.id){profile.id=newId();saveProfile()}
    api("/api/register",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:profile.id})}).then(function(r){$("#w-mem").textContent="Members: "+r.members}).catch(function(){});
  }
  var UPD="https://ebaresearch.my.canva.site/peakxsd-browser-links-updates-here";
  var RULES=[{t:"Don't visit heavy websites."},{t:"Don't share this link with people you don't trust."},{t:"On websites, use your own Gmail and password."},{t:"For new browser updates, go to this website:",u:"@UPD",l:"Visit →"}];
  function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function rulesDoc(){
    var li=RULES.map(function(r){var u=r.u==="@UPD"?UPD:r.u;return"<li>"+esc(r.t)+(u&&/^https?:\/\//.test(u)?' <a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(r.l||"Visit →")+"</a>":"")+"</li>"}).join("");
    return'<!DOCTYPE html><meta charset="utf-8"><style>body{margin:0;padding:24px 26px;font-family:Segoe UI,system-ui,sans-serif;background:var(--surf);color:var(--deep)}h2{margin:0 0 14px;font-size:22px;letter-spacing:-.02em}ol{margin:0;padding-left:22px}li{margin:0 0 12px;font-size:15px;line-height:1.45}a{color:var(--blue);font-weight:600}</style><h2>Rules</h2><ol>'+li+"</ol>";
  }
  $("#rbtn").onclick=function(){$("#rframe").srcdoc=withVars(rulesDoc());modal("#rulesm",true)};
  $("#rclose").onclick=function(){modal("#rulesm",false)};
  $("#rulesm").addEventListener("click",function(e){if(e.target===$("#rulesm"))modal("#rulesm",false)});
  function pullInfo(){
    api("/api/info").then(function(i){
      info=i;if(i.updatesUrl)UPD=i.updatesUrl;if(i.rules&&i.rules.length)RULES=i.rules;
      $("#w-mem").textContent="Members: "+i.members;
      if(parseInt(i.build,10)>parseInt(BUILD,10))$("#upd").style.display="flex";
    }).catch(function(){$("#w-mem").textContent="Members: —"});
  }
  $("#updbtn").onclick=function(){var t=(info&&info.appUrl)||apiBase();if(location.origin===apiBase())location.reload();else location.href=t+"/"};
  $("#w-mem").textContent="Members: …";pullInfo();regRemote();setInterval(pullInfo,60000);

  /* connection: service worker + Wisp */
  function fail(m){status.className="err";status.textContent=m}
  function reach(url,ms){return new Promise(function(res,rej){
    var ws;try{ws=new WebSocket(url)}catch(e){return rej(new Error("Invalid Wisp URL: "+url))}
    var to=setTimeout(function(){try{ws.close()}catch(e){}rej(new Error("No answer from "+url))},ms);
    ws.onopen=function(){clearTimeout(to);ws.close();res()};
    ws.onerror=function(){clearTimeout(to);rej(new Error("Can't reach "+url))};
  })}
  async function boot(){
    if(!("serviceWorker" in navigator))return fail("This browser can't run service workers (HTTPS is required).");
    var wisp=window.PEAKX_WISP||((location.protocol==="https:"?"wss":"ws")+"://"+location.host+"/wisp/");
    wispUrl=wisp;if(!window.PEAKX_WISP&&/htmlhoster/.test(location.hostname))return fail("Set your Wisp server in config.js: window.PEAKX_WISP = \"wss://your-app.onrender.com/wisp/\". htmlhoster can't run the Wisp server itself.");
    try{
      await navigator.serviceWorker.register("sw.js",{scope:"./"});
      await navigator.serviceWorker.ready;
      status.textContent="Connecting to server… (free hosting can take ~30s to wake up)";
      await reach(wisp,30000);
      var conn=new BareMux.BareMuxConnection(BASE+"baremux/worker.js");
      await conn.setTransport(BASE+"epoxy/transport-v2.mjs",[{wisp:wisp}]);
      initSJ();ready=true;status.className="ok";status.textContent="Ready";
      setTimeout(function(){status.style.visibility="hidden"},1800);
      if(active)select(active);
    }catch(err){fail("Couldn't connect. "+(err&&err.message||err))}
  }

  /* restore saved tabs */
  drawHist();
  var saved=ld("tabs",null);
  if(saved&&saved.list&&saved.list.length){
    saved.list.forEach(function(s){createTab(s.url,s.title,s.icon,s.pinned)});reorder();
    select(tabs[Math.min(Math.max(saved.active,0),tabs.length-1)]);
  }else newTab();
  boot();
})();
</script>
</body>
</html>
